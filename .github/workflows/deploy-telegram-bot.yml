name: Deploy Telegram Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches:
      - main
    paths:
      - 'bot/**'
      - 'scripts/deploy_bot.ps1'
      - 'scripts/start_bot.cmd'
      - 'requirements.txt'
      - '.github/workflows/deploy-telegram-bot.yml'

jobs:
  deploy:
    runs-on: [self-hosted, windows]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create bot env file
        shell: pwsh
        run: |
          if (-not (Test-Path "bot")) {
            New-Item -ItemType Directory -Path "bot" | Out-Null
          }

          @"
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_ALLOWED_USERS=${{ secrets.BOT_ALLOWED_USERS }}
          BOT_DATA_DIR=${{ github.workspace }}
          "@ | Set-Content -Path "bot/.bot.env" -NoNewline

      - name: Deploy and start bot
        shell: pwsh
        run: ./scripts/deploy_bot.ps1
