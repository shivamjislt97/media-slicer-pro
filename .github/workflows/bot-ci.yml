name: Bot CI

on:
  push:
    paths:
      - 'bot/**'
      - 'requirements.txt'
      - '.github/workflows/bot-ci.yml'
  pull_request:
    paths:
      - 'bot/**'
      - 'requirements.txt'
      - '.github/workflows/bot-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile bot
        run: python -m py_compile bot/telegram_bot.py
